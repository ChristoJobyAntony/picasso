services:
  picasso:
    build:
      context: .
      args:
        # Drives the bundled frontend copy ("inputs are resized to N px") and,
        # since the Vite config reads it at build time, the model resize logic
        # in app/src/lib/styleTransfer.ts. Inference runs in the browser, so
        # there is no longer a runtime side to keep in sync.
        PICASSO_INFERENCE_MAX_DIMENSION: ${PICASSO_INFERENCE_MAX_DIMENSION:-512}
    image: picasso:arm64-local
    platform: linux/arm64/v8
    ports:
      - "8000:8000"
