services:
  picasso:
    build:
      context: .
    image: picasso:arm64-local
    platform: linux/arm64/v8
    ports:
      - "8000:8000"
    environment:
      - TF_CPP_MIN_LOG_LEVEL=2
      - KAGGLEHUB_CACHE=/model-cache
      - KAGGLE_API_TOKEN
      - PICASSO_CORS_ORIGINS=http://localhost:8000
      - PICASSO_MAX_UPLOAD_BYTES=10485760
      - PICASSO_MAX_IMAGE_PIXELS=12000000
    volumes:
      - picasso-model-cache:/model-cache

volumes:
  picasso-model-cache:
