[tool.poetry]
name = "picasso"
version = "0.2.0"
description = "Static file server for the Picasso style-transfer SPA. Inference runs client-side via TensorFlow.js."
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.6"}

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
